<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Address Book Pro</title><style>:root{font-family:Inter,system-ui;color:#17211e;background:#eef2ef}*{box-sizing:border-box}body{margin:0}main{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{padding:30px;background:#18372f;color:white}.brand{font-size:1.5rem;font-weight:900}.side p{color:#a8c7bf}.filters{display:grid;gap:8px;margin-top:35px}.filters button{font:inherit;text-align:left;border:0;border-radius:11px;padding:12px;background:transparent;color:#c6ddd7;cursor:pointer}.filters button.active{background:#ffffff18;color:white}.content{padding:35px clamp(20px,5vw,65px)}.top{display:flex;justify-content:space-between;align-items:end;gap:20px}.kicker{color:#337b68;font-weight:800}h1{font-size:clamp(2.4rem,6vw,4.5rem);margin:.3rem 0}.search{width:min(350px,100%);font:inherit;padding:13px 16px;border:1px solid #cbd8d3;border-radius:13px}.summary{display:flex;gap:12px;margin:25px 0}.pill{padding:10px 14px;border-radius:99px;background:#dce9e4}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px}.card{background:white;border:1px solid #dbe4e0;border-radius:18px;padding:18px}.card header{display:flex;align-items:center;gap:12px}.avatar{width:46px;aspect-ratio:1;border-radius:14px;display:grid;place-items:center;background:#dce9e4;color:#245a4c;font-weight:900}.tag{display:inline-block;margin-top:16px;padding:5px 9px;border-radius:99px;background:#f1e9d4;color:#715a1e;font-size:.75rem;font-weight:800}.meta{color:#6b7773;font-size:.88rem;line-height:1.6}.empty{grid-column:1/-1;padding:60px;text-align:center;color:#75817d}@media(max-width:700px){main{grid-template-columns:1fr}.side{padding:18px}.filters{display:flex;overflow:auto;margin-top:15px}.filters button{white-space:nowrap}.top{display:block}}</style></head><body><main><aside class="side"><div class="brand">Address Book Pro</div><p>Object-oriented contacts, now with a visual search layer.</p><nav class="filters" id="filters"><button class="active" data-rel="All">All contacts</button><button data-rel="Family">Family</button><button data-rel="Friend">Friends</button><button data-rel="Business">Business</button></nav></aside><section class="content"><header class="top"><div><div class="kicker">Contact directory</div><h1>People that matter.</h1></div><input class="search" id="search" placeholder="Search name, city, or phone…"></header><div class="summary"><span class="pill" id="count"></span><span class="pill" id="birthdays"></span></div><div class="grid" id="grid"></div></section><script>const people=[{name:'John Doe',birthday:'03/15/1991',city:'New York, NY',phone:'555-1234',rel:'Friend'},{name:'Jane Smith',birthday:'07/22/1988',city:'Chicago, IL',phone:'555-5678',rel:'Business'},{name:'Alex Johnson',birthday:'03/08/1995',city:'Austin, TX',phone:'555-0192',rel:'Family'},{name:'Priya Patel',birthday:'11/19/1990',city:'Boston, MA',phone:'555-7720',rel:'Friend'},{name:'Marcus Lee',birthday:'05/03/1985',city:'Seattle, WA',phone:'555-3418',rel:'Business'}];let rel='All';function render(){const q=search.value.toLowerCase(),shown=people.filter(p=>(rel==='All'||p.rel===rel)&&Object.values(p).join(' ').toLowerCase().includes(q));grid.innerHTML=shown.length?shown.map(p=>`<article class="card"><header><div class="avatar">${p.name.split(' ').map(x=>x[0]).join('')}</div><div><b>${p.name}</b><div class="meta">${p.city}</div></div></header><p class="meta">☎ ${p.phone}<br>Birthday · ${p.birthday}</p><span class="tag">${p.rel}</span></article>`).join(''):'<div class="empty">No contacts match this view.</div>';count.textContent=`${shown.length} shown`;const m=new Date().getMonth()+1;birthdays.textContent=`${people.filter(p=>+p.birthday.slice(0,2)===m).length} birthdays this month`}filters.onclick=e=>{if(!e.target.dataset.rel)return;rel=e.target.dataset.rel;document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('active',b===e.target));render()};search.oninput=render;render()</script></main></body></html>
